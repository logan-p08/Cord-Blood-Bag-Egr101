; Classic Arduino Nano (ATmega328P), matching the uploaded sketch.
; For the old Nano bootloader, change default_envs to nano_old.
[platformio]
default_envs = nano_new

[env]
platform = atmelavr
framework = arduino
monitor_speed = 9600
lib_deps =
    adafruit/Adafruit MLX90614 Library
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    adafruit/Adafruit BusIO

[env:nano_new]
board = nanoatmega328new

[env:nano_old]
board = nanoatmega328
